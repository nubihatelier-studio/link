<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Crea patrones de mostacillas peyote, loom y brick, y teje guiándote paso a paso — todo en tu dispositivo, sin necesidad de conexión a internet."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f5b66" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nubih" />
    <title>Nubih Creator</title>

    <!-- og:image/twitter:image usan una ruta relativa hasta que el dominio final esté
         definido (ver DEPLOY.md) — conviene volverlas absolutas una vez elegido. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nubih Creator" />
    <meta
      property="og:description"
      content="Crea patrones de mostacillas peyote, loom y brick, y teje guiándote paso a paso — todo en tu dispositivo, sin necesidad de conexión a internet."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nubih Creator" />
    <meta
      name="twitter:description"
      content="Crea patrones de mostacillas peyote, loom y brick, y teje guiándote paso a paso — todo en tu dispositivo, sin necesidad de conexión a internet."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Matches --nb-canvas from src/index.css: keeps the very first paint
         (before the stylesheet and React load) from flashing white. Only
         the OS-level scheme is known this early — the in-app light/dark
         override is applied by main.tsx right before React mounts. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fbfafc;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #000000;
        }
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #initial-loader img {
        width: 48px;
        height: 48px;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader"><img src="/logo.png" alt="" width="48" height="48" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
